name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/context-observer/package-lock.json
      - run: python -m pip install -r plugins/context-observer/requirements.txt
      - run: npm ci --prefix plugins/context-observer
      - run: npm run build --prefix plugins/context-observer
      - run: git diff --exit-code -- plugins/context-observer/panel.html
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_billing_ui.mjs
      - run: node tests/test_fixed_bridge.mjs
      - run: node tests/test_ui_state.mjs
